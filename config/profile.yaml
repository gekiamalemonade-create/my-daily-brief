# ===== リスナー（自分）のプロフィール =====
# ※ 無料版はリポジトリを公開（Public）にするので、このファイルは誰でも読めます。
#   見せたくない場合は、このファイルの中身をまるごと GitHub の Secret「PROFILE_YAML」に入れ、
#   ここは一般的な内容に書き換えてください（README の STEP 1・STEP 4）。
#   なお、台本（「Kenへの示唆」を含む）は番組ページに載り、無料枠では Google にも送られます。
#   人に知られて困る事業の中身は、どこにも書かないのが安全です。

name: Ken
about: 20代の起業家。複数の事業に取り組んでいる。英語を毎日勉強している。

goals:
  - 世の中の動きを毎日「浅く広く」つかむ
  - 関心分野と、自分のビジネスに必要な知識は「深く」理解する
  - 聞いた内容を事業の判断や行動に活かす

# 興味分野。weight は 1（少し）〜5（最重要）。評価ボタンの結果で自動的に微調整されます
interests:
  - id: AI・テック
    desc: 生成AI、AIエージェント、AIのビジネス活用、主要AI企業の発表
    weight: 5
  - id: マーケ・SNS
    desc: グロースマーケティング、インフルエンサー・クリエイター経済、SNSの仕様や規約の変更、広告やステマの規制
    weight: 5
  - id: 農業・食
    desc: 農業政策、スマート農業、食料安全保障、農産物の流通
    weight: 4
  - id: 中小企業・価格転嫁
    desc: 価格交渉と価格転嫁、取引の適正化、中小企業の支援策や補助金
    weight: 4
  - id: EC・越境EC
    desc: デジタル商品の販売、ECの動向、海外向けEC
    weight: 3
  - id: 世界情勢
    desc: 地政学、主要国の政治、紛争、国際貿易
    weight: 3
  - id: 日本の経済・金融
    desc: 景気、物価、金利、為替、日銀の政策
    weight: 3
  - id: 投資・資産形成
    desc: 投資の基礎知識、市場の大きな動き、NISAなど制度
    weight: 3
  - id: 地方創生・観光
    desc: 地域活性化、シビックツーリズム、地方の動き
    weight: 3
  - id: 起業
    desc: スタートアップ、資金調達、起業家の事例
    weight: 3
  - id: 英語・海外
    desc: 海外のニュースで使われる英語表現、留学・海外の仕事
    weight: 2
  - id: 教養
    desc: 禅・哲学、ドキュメンタリー、歴史
    weight: 1

# 「1日1スキル」で連載のように少しずつ学ぶテーマ（上から順に回します）
learning_tracks:
  - マーケティングの基礎理論（STP、4P、ファネル、LTVとCAC）
  - 会計と数字の基礎（粗利、損益分岐点、キャッシュフロー）
  - 交渉と価格の決め方
  - 統計とデータの読み方

# 取り上げないもの
avoid:
  - 芸能ゴシップ
  - スポーツの試合結果
  - 事件・事故の続報だけのニュース

# 興味リストの外から「意外な発見」を混ぜる割合の目安
explore_ratio: 0.2

# 台本の「Kenへの示唆」コーナーで使う取り組み（台本は番組ページで公開されるので、書いてよい範囲だけ）
ventures:
  - デジタルマーケティング支援の事業
  - 農業・食品EC の事業
